<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>VerveFit</title>
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#4fae6a" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#10241c" media="(prefers-color-scheme: dark)" />
  <meta name="description" content="VerveFit — nutrition and training in one place. Calorie and macro tracking, selectable training programs with form demos, water and habit streaks, progress charts and an AI coach, built mobile-first." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="VerveFit" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="application-name" content="VerveFit" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="msapplication-TileColor" content="#4fae6a" />
  <meta name="msapplication-TileImage" content="/logo-192.png" />
  <meta name="msapplication-config" content="none" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="/logo-192.png" />
  <link rel="apple-touch-icon" sizes="512x512" href="/logo-512.png" />
  <link rel="icon" type="image/png" href="/logo-192.png" sizes="192x192" />
  <link rel="icon" type="image/png" href="/logo-512.png" sizes="512x512" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />
  <script>
    // Apply persisted theme before paint to avoid a flash.
    try {
      var t = localStorage.getItem("vervefit-theme") || "system";
      var dark = t === "dark" || (t === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
      if (dark) document.documentElement.classList.add("dark");
    } catch (e) {}
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
